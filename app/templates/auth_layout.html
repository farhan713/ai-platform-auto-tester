<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>{% block title %}Sign in{% endblock %} — Skylar IQ QA Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
(function () {
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('skylar.theme') || 'light'); } catch (e) {}
})();
</script>
<style>
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
    background:
      radial-gradient(900px 480px at 50% -10%, var(--accent-soft), transparent 65%),
      var(--bg);
  }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-md); padding: 34px 32px 30px; max-width: 420px; width: 100%; }
  .auth-card h1 { margin-top: 0; font-size: 22px; letter-spacing: -0.02em; color: var(--text); }
  .auth-card .brand-row { display:flex; align-items:center; gap:9px; margin-bottom: 18px; color: var(--brand); letter-spacing: -0.01em; }
  .auth-card .brand-row .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--pass); box-shadow:0 0 0 3px color-mix(in srgb, var(--pass) 18%, transparent); }
  .err { background: color-mix(in srgb, var(--fail) 9%, transparent); border-left: 3px solid var(--fail); color: var(--fail); padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .ok  { background: color-mix(in srgb, var(--pass) 9%, transparent); border-left: 3px solid var(--pass); color: var(--pass); padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="brand-row"><span class="dot"></span><b>Skylar IQ QA</b></div>
  {% block content %}{% endblock %}
</div>
</body>
</html>
